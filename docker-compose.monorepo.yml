# Docker Compose for Django + React Monorepo
# This configuration is designed to work alongside the Django backend
#
# Usage:
#   docker compose -f docker-compose.monorepo.yml up
#
# Expected monorepo structure:
#   /monorepo
#   ├── backend/     (django-ninja-boilerplate)
#   └── frontend/    (this project)
#
# Or use --project-directory to specify paths

services:
  # React Frontend (Development)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_MODE=django-spa
      - VITE_API_BASE_URL=http://localhost:8000
      - VITE_DEBUG=true
    depends_on:
      - backend
    networks:
      - monorepo-network

  # Django Backend
  # This assumes the backend is in ../backend or you can override
  backend:
    build:
      context: ${BACKEND_PATH:-../backend}
      dockerfile: ${BACKEND_DOCKERFILE:-Dockerfile}
    ports:
      - '8000:8000'
    volumes:
      - ${BACKEND_PATH:-../backend}:/app
    environment:
      - DEBUG=True
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend,frontend
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://frontend:3000
      - DATABASE_URL=postgres://postgres:postgres@db:5432/app_db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - monorepo-network

  # PostgreSQL Database
  db:
    image: postgres:16.13-alpine@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=app_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - monorepo-network

  # Redis (for caching and sessions)
  redis:
    image: redis:7.4.8-alpine@sha256:7aec734b2bb298a1d769fd8729f13b8514a41bf90fcdd1f38ec52267fbaa8ee6
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - monorepo-network

  # Nginx Reverse Proxy (Production-like setup)
  nginx:
    image: nginxinc/nginx-unprivileged:1.29.5-alpine@sha256:42a7d7f2ee23e9f5a1dcdf3647ba5c585bbd18f79e79cd817e70e8cd61c55779
    user: '101:101'
    read_only: true
    tmpfs:
      - /tmp:uid=101,gid=101,mode=1770
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/health']
      interval: 30s
      timeout: 3s
      retries: 3
    ports:
      - '80:8080'
    volumes:
      - ./nginx/monorepo.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/security-headers.conf:/etc/nginx/security-headers.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - monorepo-network
    profiles:
      - production

networks:
  monorepo-network:
    driver: bridge

volumes:
  frontend_node_modules:
  postgres_data:
  redis_data:
